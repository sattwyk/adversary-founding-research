[workspace]
resolver = "2"
members = ["crates/protocol", "crates/sdk", "crates/adversary", "examples/redb-adapter"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
sha2 = "0.10"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
